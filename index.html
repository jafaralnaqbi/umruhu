<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4a6e">
<title>عمره فيما أفناه</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g:#1f6b3f;--g2:#2a8150;--g3:#e2f0e6;--g4:#f0f7f2;
  --bg:#edf1ee;--card:#fbfaf6;--soft:#f5f2ea;--line:#e5dfd3;
  --ink:#1d2722;--muted:#69736d;
  --red:#c62828;--redbg:#fde8e8;--amber:#8a5800;--amberbg:#fff1d6;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
svg{flex:none}
.app{max-width:600px;margin:0 auto;padding:0 12px}
.hidden{display:none!important}

.hero{position:relative;text-align:center;margin:0 -12px;padding:calc(16px + env(safe-area-inset-top)) 16px 14px;
  background:radial-gradient(120% 90% at 50% 0%,#fffdf6 0%,#f3eee1 55%,var(--bg) 100%)}
.hero .logo{width:56px;height:56px;color:#1f4a6e;margin:0 auto;display:block}
.hero h1{margin:2px 0 6px;font-size:31px;font-weight:800;color:#1f4a6e}
.tagline{display:inline-block;margin:0;padding:4px 16px;background:#ffffffb3;border:1px solid var(--line);border-radius:999px;font-size:14px;color:#36423b;line-height:1.5}
.gear{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;width:46px;height:46px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:#26302b;box-shadow:0 2px 8px #0000000f}
.gear svg{width:24px;height:24px}
.sync{position:absolute;top:calc(20px + env(safe-area-inset-top));right:14px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;gap:5px;max-width:42%}
.sync i{width:8px;height:8px;border-radius:50%;background:#b8beb9;flex:none}
.sync.ok i{background:#2e9d58}.sync.busy i{background:#e0a100}.sync.err i{background:var(--red)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px #0000000a,0 4px 14px #00000009}
.warn{margin-top:10px;padding:10px 14px;border-radius:14px;background:#fff4e0;border:1px solid #f2d29b;color:#7a4b00;font-size:14px}

.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 8px 8px;margin-top:6px}
.date-chip{position:relative;display:flex;align-items:center;gap:10px;min-width:0;flex:1;padding:4px}
.date-chip svg{width:24px;height:24px;color:#26302b}
.date-chip .dt{display:flex;flex-direction:column;min-width:0}
.date-chip .dl{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date-chip .hl{font-size:13px;color:var(--muted)}
.date-chip input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0}
.day-nav{display:flex;align-items:center;gap:4px}
.nav-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#26302b}
.nav-btn:active{background:var(--soft)}
.nav-btn:disabled{opacity:.3}
.nav-btn svg{width:22px;height:22px}
.today-btn{font-size:14px;font-weight:700;color:var(--g);padding:6px 10px;border-radius:10px;background:var(--g3)}

/* progress card */
.prog{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 12px;background:linear-gradient(135deg,#2d5f86,#1b3f5e);color:#fff;border:0}
.ring{position:relative;width:62px;height:62px;flex:none}
.ring svg{width:62px;height:62px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:800;color:#f6d784}
.prog-t{flex:1;min-width:0}
.prog-t h2{margin:0;font-size:16px;font-weight:800}
.prog-t p{margin:0 0 6px;font-size:13px;opacity:.9}
.qlink{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:10px;background:#ffffff1f;border:1px solid #ffffff38;font-weight:700;font-size:13px;text-decoration:none;color:#fff}
.qlink svg{width:16px;height:16px}

/* category cards */
.cat{margin-top:10px;overflow:hidden}
.cat-h{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;text-align:right;font-weight:800;font-size:18px}
.cat-h .cic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.cat-h .cic svg{width:21px;height:21px}
.cat-h .ttl{flex:1;min-width:0}
.cat-h .cnt{font-size:14px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);padding:3px 10px;border-radius:999px}
.cat-h .chev{width:22px;height:22px;color:var(--muted);transition:transform .2s}
.cat.open .cat-h .chev{transform:rotate(90deg)}
.cat-bar{height:4px;background:#ece8de;margin:0 14px}
.cat-bar i{display:block;height:100%;background:var(--c);border-radius:4px;transition:width .3s}
.cat-b{display:none;padding:10px 10px 12px}
.cat.open .cat-b{display:flex;flex-direction:column;gap:8px}
.addb{display:flex;gap:6px;margin-top:2px}.addb .inp{min-height:42px;padding:8px 11px}
.cat-empty{font-size:14px;color:var(--muted);text-align:center;padding:8px}

.it{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 11px;display:flex;align-items:center;gap:10px}
.it.done{background:#f3faf5;border-color:#cfe6d6}
.it-b{flex:1;min-width:0}
.it-n{font-weight:700;font-size:16px}
.it-s{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.streak{display:inline-flex;align-items:center;gap:2px;color:#d9631a;font-weight:700;font-size:12.5px}
.streak svg{width:14px;height:14px}
.tick{width:40px;height:40px;border-radius:12px;border:2px solid #cfd6d1;display:grid;place-items:center;color:transparent;background:#fff;flex:none}
.tick svg{width:24px;height:24px}
.tick.on{background:var(--c,var(--g));border-color:var(--c,var(--g));color:#fff}
.nt{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#9aa39d;flex:none}
.nt svg{width:19px;height:19px}
.nt.has{color:var(--g);background:var(--g3)}
.it-note{margin-top:6px;padding:6px 9px;background:var(--soft);border-radius:9px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.bar{height:6px;background:#ece8de;border-radius:6px;margin:5px 0 3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--g));border-radius:6px}
.ctr{display:flex;align-items:center;gap:4px;flex:none}
.ctr button{min-width:38px;height:38px;border-radius:11px;background:var(--soft);border:1px solid var(--line);font-weight:800;font-size:15px;padding:0 6px}
.ctr .cv{min-width:52px;background:#fff;color:var(--g);font-size:17px}
.lvls{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.lv{padding:6px 10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13.5px;color:#4a5550}
.lv[aria-pressed="true"]{background:var(--lc);border-color:var(--lc);color:#fff}
.subs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.sub{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;border:1.5px dashed #cfd6d1;font-size:13px;font-weight:700;color:#5f6a64;background:#fff}
.sub svg{width:15px;height:15px}
.sub[aria-pressed="true"]{border-style:solid;border-color:var(--g2);background:var(--g3);color:var(--g)}
.it.col{flex-direction:column;align-items:stretch}
.it-top{display:flex;align-items:center;gap:8px}

/* muhasaba */
.muh{margin-top:10px;padding:14px}
.muh h3{margin:0 0 4px;font-size:19px;color:var(--g);display:flex;align-items:center;gap:8px}
.muh h3 svg{width:24px;height:24px}
.muh .saved{font-size:12.5px;color:var(--muted);font-weight:500;margin-inline-start:auto}
.muh label{display:block;font-weight:700;font-size:14.5px;margin:10px 2px 5px}

/* accordions */
.acc{margin-top:10px;overflow:hidden}
.acc-head{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;font-size:19px;font-weight:800;text-align:right;cursor:pointer;user-select:none}
.acc-head:focus-visible{outline:3px solid #2a815066;outline-offset:-3px}
.acc-head .ic{width:28px;height:28px;color:var(--g)}
.acc-head .ttl{flex:1;min-width:0}
.acc-head .chev{width:24px;height:24px;color:var(--g);transition:transform .2s}
.acc.open .acc-head .chev{transform:rotate(90deg)}
.acc-body{display:none;padding:2px 12px 14px}
.acc.open .acc-body{display:block}
.badge{font-size:13.5px;font-weight:700;padding:4px 11px;border-radius:10px;white-space:nowrap}
.badge.amber{background:var(--amberbg);color:var(--amber)}
h4.sub{margin:16px 2px 8px;font-size:15.5px;color:#36423b}
.empty{padding:14px;text-align:center;color:var(--muted);font-size:15px;background:var(--g4);border-radius:12px}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-size:17px}
.cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-wd span{text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.day{position:relative;aspect-ratio:1/1;border-radius:11px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px;line-height:1.1}
.day small{font-size:10.5px;font-weight:700;opacity:.85}
.day.sel{outline:2.5px solid #d9631a;outline-offset:-1px}
.day.today .num{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.day.future{opacity:.4}
.day.dark{color:#fff}
.legend{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);margin-top:10px;justify-content:center}
.legend i{width:18px;height:12px;border-radius:3px;display:inline-block}

/* stats */
.tabs{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.tabs button{flex:1;padding:8px 4px;border-radius:9px;font-weight:700;font-size:15px;color:#4a5550}
.tabs button[aria-pressed="true"]{background:#fff;color:var(--g);box-shadow:0 1px 3px #0000001a}
.range{font-size:13.5px;color:var(--muted);margin:8px 2px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
@media(min-width:480px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center}
.kpi b{display:block;font-size:24px;color:var(--g);line-height:1.2}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi em{display:block;font-style:normal;font-size:12px;font-weight:700}
.up{color:#2e7d32}.down{color:var(--red)}
.chart{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 8px 4px;margin-top:8px}
.chart svg{width:100%;height:auto;display:block}
.hl2{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.hlc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;border-right:4px solid var(--hc)}
.hlc span{font-size:12.5px;color:var(--muted);display:block}
.hlc b{font-size:15px}
.srows{display:flex;flex-direction:column;gap:6px}
.srow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.srow .r1{display:flex;align-items:center;gap:8px}
.srow .sn{flex:1;min-width:0;font-weight:700}
.srow .sv{font-weight:800;color:var(--g)}
.srow .r2{display:flex;gap:10px;font-size:12.5px;color:var(--muted);margin-top:2px;flex-wrap:wrap}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#ece8de;margin-top:6px}
.stack i{display:block;height:100%}
.leg2{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:#4a5550;margin-top:8px}
.leg2 span{display:inline-flex;align-items:center;gap:4px}
.leg2 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.method{font-size:13px;color:var(--muted);background:var(--g4);border-radius:10px;padding:9px 11px;margin-top:10px}

/* muhasaba log */
.mlog{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.mlog .md{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:4px}
.mlog .md button{font-size:13px;color:var(--g);font-weight:700;background:var(--g3);padding:4px 10px;border-radius:9px}
.mlog p{margin:4px 0;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.mlog p b{color:#36423b}
.list{display:flex;flex-direction:column;gap:8px}

/* manage */
.mi{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 6px}
.mi .mn{flex:1;min-width:0}
.mi .mn b{display:block;font-size:15px}
.mi .mn span{font-size:12.5px;color:var(--muted)}
.mi button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#56615a}
.mi button:active{background:var(--soft)}
.mi button:disabled{opacity:.25}
.mi svg{width:18px;height:18px}

/* forms */
.inp,select.inp,textarea.inp{width:100%;padding:11px 12px;border:1px solid #d9d3c6;border-radius:12px;background:#fff;font-size:16px;min-height:46px}
textarea.inp{min-height:76px;resize:vertical}
.inp:focus{outline:2px solid #2a815055;border-color:var(--g2)}
.lbl{display:block;font-weight:700;font-size:15px;margin:0 2px 6px}
.lbl small{font-weight:500;color:var(--muted)}
.f-sec{margin-top:14px}
.f-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hint{font-size:13px;color:var(--muted);margin:5px 2px 0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;padding:9px 10px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14.5px}
.seg button[aria-pressed="true"]{border-color:var(--g);background:var(--g3);color:var(--g)}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pick{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 3px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px;line-height:1.25;text-align:center}
.pick svg{width:22px;height:22px;color:var(--c)}
.pick[aria-pressed="true"]{border-color:var(--g);background:var(--g3);box-shadow:inset 0 0 0 1px var(--g)}
.err{color:var(--red);font-weight:700;font-size:14.5px;margin-top:12px}
.err:empty{display:none}
.btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{flex:1 1 auto;padding:12px 14px;border-radius:13px;font-weight:800;font-size:16px;background:var(--soft);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn svg{width:19px;height:19px}
.btn.primary{background:linear-gradient(180deg,#2c8753,#1c5f37);color:#fff;border:0}
.btn.danger{background:var(--redbg);color:var(--red);border-color:#f5c5c5}
.btn.small{flex:0 0 auto;padding:8px 12px;font-size:14px;border-radius:11px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.quick button{padding:10px 4px;border-radius:11px;background:var(--soft);border:1px solid var(--line);font-weight:800}

.layer{position:fixed;inset:0;background:#0b1a1266;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.layer[hidden]{display:none}
.sheet{width:100%;max-width:600px;max-height:92vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px #0003;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h3{margin:0;font-size:20px;color:var(--g)}
.x{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--soft)}
.x svg{width:20px;height:20px}
#dlg{align-items:center;z-index:60;padding:20px}
.dlg-box{background:var(--card);border-radius:18px;padding:18px;max-width:400px;width:100%;box-shadow:0 10px 40px #0004}
.dlg-box p{margin:0 0 4px;font-size:16.5px;font-weight:700}
textarea.json{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:150px}
.info{font-size:14.5px;color:#36423b}
.info li{margin-bottom:5px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1d2722;color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.bnav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -4px 18px #0000000f;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.bnav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:14px;font-size:13px;font-weight:700;color:#3a4540}
.bnav button svg{width:25px;height:25px}
.bnav button.on{background:var(--g3);color:var(--g)}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <span class="sync" id="sync"><i></i><span>على هذا الجهاز</span></span>
    <button class="gear" id="btnSettings" aria-label="المزيد"></button>
    <svg class="logo" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
      <path d="M18 8h28M18 56h28"/>
      <path d="M21 8c0 12 9 16 11 24-2 8-11 12-11 24h22c0-12-9-16-11-24 2-8 11-12 11-24" fill="#e6eef6"/>
      <path d="M26 50c2-4 4-6 6-7 2 1 4 3 6 7z" fill="#e0b443" stroke="none"/>
      <path d="M27 17h10c-1 3-3 5-5 7-2-2-4-4-5-7z" fill="#e0b443" stroke="none" opacity=".7"/>
    </svg>
    <h1>عمره فيما أفناه</h1>
    <p class="tagline">«لا تزول قدما عبدٍ يوم القيامة حتى يُسأل عن عمره فيما أفناه»</p>
  </header>

  <div id="warn" class="warn hidden"></div>

  <div class="card datebar">
    <label class="date-chip">
      <span id="calIc"></span>
      <span class="dt"><span class="dl" id="dateLabel"></span><span class="hl" id="hijriLabel"></span></span>
      <input type="date" id="datePicker" aria-label="اختيار تاريخ">
    </label>
    <div class="day-nav">
      <button class="today-btn hidden" id="todayBtn">اليوم</button>
      <button class="nav-btn" id="prevDay" aria-label="اليوم السابق"></button>
      <button class="nav-btn" id="nextDay" aria-label="اليوم التالي"></button>
    </div>
  </div>

  <div class="card prog" id="prog"></div>

  <div id="cats"></div>

  <section class="card muh" id="muh"></section>

  <section class="card acc" data-acc="stats">
    <div class="acc-head" role="button" tabindex="0"><span data-ic="chart" class="icw"></span><span class="ttl">الإحصائيات</span><span class="chevw"></span></div>

function fmt(d,opts,cal){

}

function hijriDay(s){

  }

}

/* ---------- Clean / validate ---------- */
function cleanItem(x){
  if(!x||typeof x!=='object'||typeof x.id!=='string'||!x.id||x.id.length>64)return null;
  if(!/^[\w\-:.]+$/.test(x.id))return null;
  if(typeof x.name!=='string'||!x.name.trim())return null;
  const type=TYPES[x.type]?x.type:'check';
  const it={id:x.id,name:x.name.trim().slice(0,80),cat:CAT[x.cat]?x.cat:'amal',type,
    since:isDate(x.since)?x.since:todayStr(),
    sched:{mode:['daily','wd','white'].includes(x.sched&&x.sched.mode)?x.sched.mode:'daily',
      wd:Array.isArray(x.sched&&x.sched.wd)?x.sched.wd.filter(n=>Number.isInteger(n)&&n>=0&&n<=6):[]}};
  if(it.sched.mode==='wd'&&!it.sched.wd.length)it.sched.mode='daily';
  if(type==='count'){it.target=Number.isFinite(x.target)&&x.target>0?x.target:1;it.unit=typeof x.unit==='string'?x.unit.slice(0,20):'';it.step=Number.isFinite(x.step)&&x.step>0?x.step:1;}
  if(type==='level'){it.levels=Array.isArray(x.levels)?x.levels.filter(s=>typeof s==='string'&&s.trim()).map(s=>s.trim().slice(0,30)).slice(0,8):[];if(it.levels.length<2)it.levels=['تام','ناقص'];}
  if(type==='prayer'){const s=x.subs||{};it.subs={q:!!s.q,b:!!s.b,a:!!s.a};}
  return it;
}
function cleanRec(r){
  if(!r||typeof r!=='object')return null;
  const o={};
  if(typeof r.v==='number'&&isFinite(r.v)&&r.v>=0)o.v=r.v;
  else if(typeof r.v==='string'&&PLK[r.v])o.v=r.v;
  ['q','b','a'].forEach(k=>{if(r[k])o[k]=1;});
  if(typeof r.n==='string'&&r.n.trim())o.n=r.n.slice(0,1000);
  return Object.keys(o).length?o:null;
}
function cleanMonth(m){
  const out={log:{},muh:{},u:typeof m.u==='number'?m.u:0};
  if(m.log&&typeof m.log==='object')for(const d in m.log){if(!isDate(d)||!m.log[d]||typeof m.log[d]!=='object')continue;const day={};for(const id in m.log[d]){const r=cleanRec(m.log[d][id]);if(r)day[id]=r;}if(Object.keys(day).length)out.log[d]=day;}
  if(m.muh&&typeof m.muh==='object')for(const d in m.muh){if(!isDate(d))continue;const x=m.muh[d]||{},y={};['g','b','r'].forEach(k=>{if(typeof x[k]==='string'&&x[k].trim())y[k]=x[k].slice(0,3000);});if(Object.keys(y).length)out.muh[d]=y;}
  return out;
}

/* ---------- Local storage (IndexedDB → localStorage → memory) ---------- */
const Local=(function(){
  const DBN='umruhu-fima-afnah',ST='kv';let db=null,mode='memory';const mem={};
  function openIDB(){return new Promise((res,rej)=>{try{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
  async function init(){try{db=await openIDB();mode='idb';}catch(e){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');mode='ls';}catch(e2){mode='memory';}}}
  function get(k){
    if(mode==='idb')return new Promise(res=>{try{const q=db.transaction(ST,'readonly').objectStore(ST).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined);}catch(e){res(undefined);}});
    if(mode==='ls'){try{const v=localStorage.getItem(DBN+':'+k);return Promise.resolve(v?JSON.parse(v):undefined);}catch(e){return Promise.resolve(undefined);}}
    return Promise.resolve(mem[k]);
  }
  function set(k,v){
    if(mode==='idb')return new Promise(res=>{try{const tx=db.transaction(ST,'readwrite');tx.objectStore(ST).put(v,k);tx.oncomplete=()=>res(true);tx.onerror=tx.onabort=()=>res(false);}catch(e){res(false);}});
    if(mode==='ls'){try{localStorage.setItem(DBN+':'+k,JSON.stringify(v));return Promise.resolve(true);}catch(e){return Promise.resolve(false);}}
    mem[k]=JSON.parse(JSON.stringify(v));return Promise.resolve(true);
  }
  return{init,get,set,get mode(){return mode;}};
})();
let localT;
function saveLocal(){clearTimeout(localT);localT=setTimeout(()=>Local.set('state',{items:S.items,metaU:S.metaU,months:S.months}),250);}
const savePrefs=()=>Local.set('prefs',S.prefs);

/* ---------- Cloud sync (claude db, private per-user) ---------- */
const Cloud={col:null,state:'local',dirty:new Set(),del:new Set(),flushing:false,t:null,first:true};
function setSync(st){
  Cloud.state=st;const el=$('#sync');
  const map={local:['','على هذا الجهاز'],ok:['ok','محفوظ في حسابك'],busy:['busy','جارٍ الحفظ…'],slow:['busy','جارٍ الاتصال…'],err:['err','تعذّرت المزامنة']};
  const v=map[st]||map.local;el.className='sync '+v[0];el.querySelector('span').textContent=v[1];
}
function markDirty(id){
  if(id==='meta')S.metaU=Date.now();
  else{const m=month(id.slice(2),true);m.u=Date.now();}
  Cloud.dirty.add(id);saveLocal();scheduleFlush();
}
function scheduleFlush(){if(!Cloud.col)return;clearTimeout(Cloud.t);Cloud.t=setTimeout(flush,900);}
function bodyFor(id){
  if(id==='meta')return{items:S.items,u:S.metaU};
  const m=S.months[id.slice(2)];return m?{log:m.log,muh:m.muh,u:m.u}:null;
}
async function flush(){
  if(!Cloud.col||Cloud.flushing)return;
  if(!Cloud.dirty.size&&!Cloud.del.size)return;
  Cloud.flushing=true;setSync('busy');let failed=false;
  try{
    for(const id of Array.from(Cloud.del)){Cloud.del.delete(id);try{await Cloud.col.doc(id).delete();}catch(e){failed=true;}}
    for(const id of Array.from(Cloud.dirty)){
      Cloud.dirty.delete(id);const b=bodyFor(id);if(!b)continue;
      try{await Cloud.col.doc(id).set(JSON.parse(JSON.stringify(b)));}
      catch(e){
        if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*900));try{await Cloud.col.doc(id).set(JSON.parse(JSON.stringify(b)));continue;}catch(e2){}}
        failed=true;Cloud.dirty.add(id);
        if(e&&e.code==='quota_exceeded')toast('امتلأت مساحة الحفظ في الحساب؛ صدّر نسخة احتياطية');
        if(e&&(e.code==='revoked'||e.code==='invalid_argument'||e.code==='not_granted')){Cloud.col=null;}
        break;
      }
    }
  }finally{Cloud.flushing=false;}
  setSync(failed?'err':(Cloud.col?'ok':'local'));
  if(!failed&&(Cloud.dirty.size||Cloud.del.size))scheduleFlush();
}
function applyCloud(snap){
  let changed=false;const seen=new Set();
  snap.docs.forEach(doc=>{
    if(!doc.exists)return;const id=doc.id,data=doc.data()||{};seen.add(id);
    const cu=typeof data.u==='number'?data.u:0;
    if(id==='meta'){
      if(cu>S.metaU&&Array.isArray(data.items)){const items=data.items.map(cleanItem).filter(Boolean);if(items.length||!S.items.length){S.items=dedupe(items);S.metaU=cu;changed=true;}}
      else if(cu<S.metaU)Cloud.dirty.add('meta');
    }else if(/^m-\d{4}-\d{2}$/.test(id)){
      const mk=id.slice(2),loc=S.months[mk];
      if(!loc||cu>loc.u){S.months[mk]=cleanMonth(data);S.months[mk].u=cu;changed=true;}
      else if(cu<loc.u)Cloud.dirty.add(id);
    }
  });
  if(!snap.metadata.fromCache&&Cloud.first){
    Cloud.first=false;
    if(!seen.has('meta'))Cloud.dirty.add('meta');
    Object.keys(S.months).forEach(mk=>{if(!seen.has('m-'+mk))Cloud.dirty.add('m-'+mk);});
  }
  if(changed){saveLocal();renderAll();}
  if(Cloud.dirty.size)scheduleFlush();
}
function dedupe(items){const s=new Set();return items.filter(i=>!s.has(i.id)&&s.add(i.id));}
async function initCloud(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    Cloud.col=db.collection('data/users/'+id);
    setSync('slow');
    const timer=setTimeout(()=>{if(Cloud.state==='slow')setSync('err');},10000);
    Cloud.col.onSnapshot(snap=>{
      if(!snap.metadata.fromCache){clearTimeout(timer);if(Cloud.state!=='busy')setSync('ok');}
      applyCloud(snap);
    },err=>{clearTimeout(timer);Cloud.col=null;setSync('err');});
  }catch(e){Cloud.col=null;setSync('local');}
}

/* ---------- Scheduling & scoring ---------- */
function scheduled(it,d){
  const m=it.sched.mode;
  if(m==='daily')return true;
  if(m==='wd')return it.sched.wd.includes(parse(d).getDay());
  if(m==='white'){const h=hijriDay(d);return h===13||h===14||h===15;}
  return true;
}
function dayHasAny(d){const m=S.months[mkey(d)];return !!(m&&m.log[d]&&Object.keys(m.log[d]).length);}
const counts=(it,d,r)=>d<=todayStr()&&scheduled(it,d)&&(d>=it.since||!!r||(!it.id.startsWith('u_')&&dayHasAny(d)));
function score(it,r){
  if(!r)return 0;
  if(it.type==='check')return r.v?1:0;
  if(it.type==='count')return Math.min((r.v||0)/it.target,1);
  if(it.type==='level'){if(typeof r.v!=='number'||r.v<1)return 0;const n=it.levels.length,i=r.v-1;return i<n?(n-i)/n:0;}
  if(it.type==='prayer')return r.v&&PLK[r.v]?PLK[r.v].w:0;
  return 0;
}
function isDone(it,r){
  if(!r)return false;
  if(it.type==='check')return !!r.v;
  if(it.type==='count')return (r.v||0)>=it.target;
  if(it.type==='level')return typeof r.v==='number'&&score(it,r)>=.5;
  if(it.type==='prayer')return r.v==='masjid'||r.v==='waqt';
  return false;
}
function dayScore(d){
  let s=0,n=0,done=0;
  S.items.forEach(it=>{const r=rec(d,it.id);if(!counts(it,d,r))return;n++;s+=score(it,r);if(isDone(it,r))done++;});
  return n?{s:s/n,n,done}:null;
}
function firstDate(){
  let f=todayStr();S.items.forEach(i=>{if(i.since<f)f=i.since;});
  Object.keys(S.months).forEach(mk=>Object.keys(S.months[mk].log).forEach(d=>{if(d<f)f=d;}));
  return f;
}
function streaks(it){
  const t=todayStr();let start=it.since;
  Object.keys(S.months).forEach(mk=>Object.keys(S.months[mk].log).forEach(d=>{if(d<start&&S.months[mk].log[d][it.id])start=d;}));
  let run=0,best=0;
  for(const d of dateRange(start,t)){
    const r=rec(d,it.id);if(!counts(it,d,r))continue;
    if(isDone(it,r)){run++;if(run>best)best=run;}
    else if(d!==t)run=0;
  }
  return{cur:run,best};
}
const pct=x=>Math.round(x*100);

/* ---------- Mutations ---------- */
function setRec(d,id,patch){
  const m=month(mkey(d),true);const day=m.log[d]=m.log[d]||{};
  const r=Object.assign({},day[id]||{},patch);
  Object.keys(r).forEach(k=>{if(r[k]==null||r[k]===''||r[k]===0||r[k]===false)delete r[k];});
  if(Object.keys(r).length)day[id]=r;else delete day[id];
  if(!Object.keys(day).length)delete m.log[d];
  markDirty('m-'+mkey(d));
}
function setMuh(d,k,v){
  const m=month(mkey(d),true);const x=Object.assign({},m.muh[d]||{});
  if(v&&v.trim())x[k]=v.slice(0,3000);else delete x[k];
  if(Object.keys(x).length)m.muh[d]=x;else delete m.muh[d];
  markDirty('m-'+mkey(d));
}

    const ms={};st.daily.forEach(x=>{if(x.v==null)return;const k=x.d.slice(0,7);(ms[k]=ms[k]||[]).push(x.v);});

    if(keys.length)h+=`<h4 class="sub">متوسط كل شهر</h4><div class="chart">${barChart(keys.map(k=>ms[k].reduce((a,b)=>a+b,0)/ms[k].length),keys.map(k=>fmt(parse(k+'-01'),{month:'short'})))}</div>`;
  }else{
    const vals=dateRange(R.a,R.b).map(d=>{const x=st.daily.find(y=>y.d===d);return x?x.v:null;});
    const labels=dateRange(R.a,R.b).map((d,i)=>statTab==='week'?['س','ح','ن','ث','ر','خ','ج'][i]:((i%5===0)?String(parse(d).getDate()):''));
    h+=`<h4 class="sub">الالتزام يومًا بيوم</h4><div class="chart">${barChart(vals,labels)}</div>`;
  }
  // best/weakest
  const ranked=S.items.map(it=>({it,x:st.per[it.id]})).filter(o=>o.x.sch>=2).map(o=>Object.assign(o,{p:o.x.sc/o.x.sch})).sort((a,b)=>b.p-a.p);
  if(ranked.length>=2&&ranked[0].p>ranked[ranked.length-1].p){const best=ranked[0],worst=ranked[ranked.length-1];
    h+=`<div class="hl2"><div class="hlc" style="--hc:#2e7d32"><span>الأقوى التزامًا</span><b>${esc(best.it.name)}</b> · ${pct(best.p)}%</div><div class="hlc" style="--hc:var(--red)"><span>يحتاج عناية</span><b>${esc(worst.it.name)}</b> · ${pct(worst.p)}%</div></div>`;}
  // prayers detail
  if(prs.length&&pt){
    h+=`<h4 class="sub">تفصيل الصلوات المفروضة</h4><div class="srows">`+prs.map(it=>{const x=st.per[it.id];if(!x.sch)return '';
      const segs=PL.map(p=>({c:p.c,v:x.lv[p.k]||0})).concat([{c:'#d8d3c8',v:x.lv.none||0}]);
      const subs=SUBS.filter(([k])=>it.subs[k]&&x.subs[k][1]).map(([k,,full])=>`${full}: ${x.subs[k][0]}/${x.subs[k][1]}`);
      return `<div class="srow"><div class="r1"><span class="sn">${esc(it.name)}</span><span class="sv">${pct(x.sc/x.sch)}%</span></div>
      <div class="stack">${segs.filter(s=>s.v).map(s=>`<i style="width:${s.v/x.sch*100}%;background:${s.c}"></i>`).join('')}</div>
      <div class="r2"><span>في المسجد ${x.lv.masjid||0}</span><span>في وقتها ${x.lv.waqt||0}</span>${(x.lv.late||0)+(x.lv.qada||0)+(x.lv.missed||0)?`<span>متأخرة/قضاء/فاتت ${(x.lv.late||0)+(x.lv.qada||0)+(x.lv.missed||0)}</span>`:''}${x.lv.none?`<span>غير مسجّلة ${x.lv.none}</span>`:''}</div>
      ${subs.length?`<div class="r2">${subs.map(esc).join(' · ')}</div>`:''}</div>`;}).join('')+`</div>
      <div class="leg2">${PL.map(p=>`<span><i style="background:${p.c}"></i>${p.n}</span>`).join('')}<span><i style="background:#d8d3c8"></i>غير مسجّلة</span></div>`;
  }
  // per category items
  CATS.forEach(C=>{
    const its=S.items.filter(i=>i.cat===C.k&&i.type!=='prayer'&&st.per[i.id].sch);if(!its.length)return;
    h+=`<h4 class="sub">${C.name}</h4><div class="srows">`+its.map(it=>{const x=st.per[it.id],s=streaks(it),p=x.sc/x.sch;
      return `<div class="srow"><div class="r1"><span class="sn">${esc(it.name)}</span><span class="sv">${pct(p)}%</span></div>
      <div class="bar" style="--c:${C.color}"><i style="width:${p*100}%"></i></div>
      <div class="r2"><span>أُتمّ ${x.done} من ${x.sch}</span><span>السلسلة الحالية ${s.cur}</span><span>أطول سلسلة ${s.best}</span></div></div>`;}).join('')+'</div>';
  });
  h+=`<div class="method">النسبة لكل يوم = متوسط ما أنجزته من البنود المجدولة فيه. العدّاد يُحسب بنسبة ما بلغته من الهدف، والصلاة بحسب مستواها (المسجد ١٠٠٪، في وقتها ٨٥٪، متأخرة ٥٠٪، قضاء ٢٥٪). ولا يُحسب البند في غير أيامه، ولا في الأيام السابقة لإضافته. «السلسلة» أيام متتالية أُتمّ فيها البند، ولا تنقطع بيوم لم ينته بعد.</div>`;
  $('#statsBody').innerHTML=h;
}

/* ---------- Render: muhasaba log ---------- */
function renderMlog(){
  const all=[];Object.keys(S.months).forEach(mk=>Object.keys(S.months[mk].muh).forEach(d=>all.push(d)));
  all.sort().reverse();
  if(!all.length){$('#mlogBody').innerHTML='<div class="empty">لم تُكتب محاسبة بعد. اكتب في خانات «محاسبة النفس» أعلى الصفحة، وتظهر هنا مرتبة بالأيام.</div>';return;}
  let h=`<p class="hint" style="margin:0 2px 8px">${all.length} يومًا فيها محاسبة — من الأحدث</p><div class="list">`+all.slice(0,mlogLimit).map(d=>{const m=muhOf(d);
    return `<div class="mlog"><div class="md"><span>${esc(fmtLong(d))}</span><button data-goto="${d}">فتح اليوم</button></div>
    ${m.g?`<p><b>أحسنتُ:</b> ${esc(m.g)}</p>`:''}${m.b?`<p><b>قصّرتُ:</b> ${esc(m.b)}</p>`:''}${m.r?`<p><b>عزمتُ:</b> ${esc(m.r)}</p>`:''}</div>`;}).join('')+'</div>';

/* ---------- Render: manage ---------- */

/* ---------- Render: backup ---------- */
function backupDue(){
  const any=Object.keys(S.months).length;if(!any)return false;
  if(!S.prefs.lastBackup)return true;
  return (Date.now()-new Date(S.prefs.lastBackup).getTime())>30*864e5;
}
function renderBackup(){
  $('#backupBadge').innerHTML=backupDue()?'<span class="badge amber">يُنصح بالتصدير</span>':'';
  const lb=S.prefs.lastBackup?fmtLong(ymd(new Date(S.prefs.lastBackup))):'لم يتم بعد';
  let days=0;Object.values(S.months).forEach(m=>days+=Object.keys(m.log).length);
  const where=Cloud.col?'في حسابك على Claude (خاصة بك، تصل إليها من أي جهاز تفتح منه الصفحة)، مع نسخة على هذا الجهاز':'على هذا الجهاز فقط';
  $('#backupBody').innerHTML=`<ul class="info"><li>أيام مسجّلة: <b>${days}</b> · عدد البنود: <b>${S.items.length}</b></li><li>مكان الحفظ: <b>${where}</b></li><li>آخر تصدير: <b>${esc(lb)}</b></li></ul>
  <div class="btns"><button class="btn primary" data-action="export">${icon('download')}تصدير نسخة احتياطية</button><button class="btn" data-action="import">${icon('upload')}استيراد</button></div>`;
}
function renderWarn(){
  const w=$('#warn');
  if(Local.mode==='memory'&&!Cloud.col){w.textContent='تنبيه: لا يتاح الحفظ في هذا المتصفح الآن، فقد تضيع التسجيلات عند إغلاق الصفحة. صدّر نسخة احتياطية قبل الخروج.';w.classList.remove('hidden');}
  else w.classList.add('hidden');
}
function renderAll(){renderDate();renderProg();renderCats();renderMuh();renderStats();renderMlog();renderManage();renderBackup();renderWarn();}
function renderDay(){renderProg();renderCats();renderStats();}

/* ---------- Sheet / dialog / toast ---------- */
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
function openSheet(html){const L=$('#sheetLayer');$('#sheet').innerHTML=html;L.hidden=false;document.body.style.overflow='hidden';$('#sheet').scrollTop=0;}
function closeSheet(){$('#sheetLayer').hidden=true;$('#sheet').innerHTML='';document.body.style.overflow='';}
$('#sheetLayer').addEventListener('click',e=>{if(e.target.id==='sheetLayer'||e.target.closest('[data-close]'))closeSheet();});
function ask(msg,ok,danger){
  return new Promise(res=>{const d=$('#dlg');
    d.innerHTML=`<div class="dlg-box" role="alertdialog"><p>${esc(msg)}</p><div class="btns"><button class="btn ${danger===false?'primary':'danger'}" data-ok>${esc(ok||'تأكيد')}</button><button class="btn" data-no>إلغاء</button></div></div>`;
    d.hidden=false;
    d.onclick=ev=>{if(ev.target.closest('[data-ok]')){d.hidden=true;res(true);}else if(ev.target.closest('[data-no]')||ev.target===d){d.hidden=true;res(false);}};});
}
const sheetHead=t=>`<div class="sheet-h"><h3>${t}</h3><button class="x" data-close aria-label="إغلاق">${icon('x')}</button></div>`;

function openCounter(id){

/* ---------- Item form ---------- */
let F=null;
function openItemForm(id,cat){
  const it=id?itemById(id):null;
  F=it?JSON.parse(JSON.stringify(it)):{id:null,name:'',cat:cat||'habit',type:'check',target:10,unit:'',step:1,levels:['ممتاز','جيد','مقبول'],sched:{mode:'daily',wd:[]},since:selDate<=todayStr()?selDate:todayStr()};
  if(!F.levels)F.levels=['ممتاز','جيد','مقبول'];
  if(F.target==null){F.target=10;F.unit='';F.step=1;}
  drawItemForm();
}
function drawItemForm(){
  const isPr=F.type==='prayer';
  openSheet(`${sheetHead(F.id?'تعديل البند':'بند جديد')}
  <div class="f-sec"><label class="lbl" for="iName">اسم البند</label><input class="inp" id="iName" maxlength="80" value="${esc(F.name)}" placeholder="مثال: صلة الرحم، المشي ٣٠ دقيقة"></div>
  <div class="f-sec"><span class="lbl">القسم</span><div class="picks">${CATS.map(C=>`<button class="pick" data-icat="${C.k}" aria-pressed="${F.cat===C.k}" style="--c:${C.color}">${icon(C.icon)}${C.name}</button>`).join('')}</div></div>
  ${isPr?`<div class="f-sec"><span class="lbl">ما يُتابَع مع هذه الصلاة</span><div class="seg">${SUBS.map(([k,,full])=>`<button data-isub="${k}" aria-pressed="${!!F.subs[k]}">${full}</button>`).join('')}</div><p class="hint">مستويات الفريضة ثابتة: في المسجد، في وقتها، متأخرة، قضاء، فاتت.</p></div>`
  :`<div class="f-sec"><span class="lbl">طريقة التسجيل</span><div class="seg">${['check','count','level'].map(k=>`<button data-itype="${k}" aria-pressed="${F.type===k}">${TYPES[k]}</button>`).join('')}</div></div>`}
  ${F.type==='count'?`<div class="f-sec"><div class="f-grid"><div><label class="lbl" for="iTarget">الهدف</label><input class="inp" id="iTarget" type="number" inputmode="decimal" min="0" step="any" value="${F.target}"></div><div><label class="lbl" for="iUnit">الوحدة</label><input class="inp" id="iUnit" maxlength="20" value="${esc(F.unit||'')}" placeholder="مرة، دقيقة…"></div><div><label class="lbl" for="iStep">زر الزيادة</label><input class="inp" id="iStep" type="number" inputmode="decimal" min="0" step="any" value="${F.step}"></div></div></div>`:''}
  ${F.type==='level'?`<div class="f-sec"><label class="lbl" for="iLevels">المستويات <small>(كل مستوى في سطر، من الأعلى إلى الأدنى)</small></label><textarea class="inp" id="iLevels">${esc(F.levels.join('\n'))}</textarea><p class="hint">يُحسب الأعلى ١٠٠٪ وينزل ما بعده بالتدريج، ويُعدّ البند «تامًّا» في النصف الأعلى.</p></div>`:''}
  <div class="f-sec"><span class="lbl">الأيام</span><div class="seg">${[['daily','كل يوم'],['wd','أيام محددة'],['white','الأيام البيض']].map(([k,n])=>`<button data-imode="${k}" aria-pressed="${F.sched.mode===k}">${n}</button>`).join('')}</div>
  ${F.sched.mode==='wd'?`<div class="seg" style="margin-top:8px">${WD.map(([n,name])=>`<button data-iwd="${n}" aria-pressed="${F.sched.wd.includes(n)}">${name}</button>`).join('')}</div>`:''}
  ${F.sched.mode==='white'?'<p class="hint">١٣ و١٤ و١٥ من كل شهر هجري (تقويم أم القرى).</p>':''}</div>
  <div class="f-sec"><label class="lbl" for="iSince">يُحسب في الإحصائيات ابتداءً من</label><input class="inp" type="date" id="iSince" value="${F.since}" max="${todayStr()}"></div>
  <div class="err" id="iErr"></div>
  <div class="btns"><button class="btn primary" id="iSave">حفظ</button>${F.id?`<button class="btn danger" data-delitem="${esc(F.id)}">${icon('trash')}حذف</button>`:''}<button class="btn" data-close>إلغاء</button></div>`);
  const sh=$('#sheet');
  sh.querySelectorAll('[data-icat]').forEach(b=>b.onclick=()=>{readItemForm();F.cat=b.dataset.icat;drawItemForm();});
  sh.querySelectorAll('[data-itype]').forEach(b=>b.onclick=()=>{readItemForm();F.type=b.dataset.itype;drawItemForm();});
  sh.querySelectorAll('[data-imode]').forEach(b=>b.onclick=()=>{readItemForm();F.sched.mode=b.dataset.imode;drawItemForm();});
  sh.querySelectorAll('[data-iwd]').forEach(b=>b.onclick=()=>{const n=+b.dataset.iwd;const i=F.sched.wd.indexOf(n);if(i>=0)F.sched.wd.splice(i,1);else F.sched.wd.push(n);b.setAttribute('aria-pressed',i<0);});
  sh.querySelectorAll('[data-isub]').forEach(b=>b.onclick=()=>{const k=b.dataset.isub;F.subs[k]=!F.subs[k];b.setAttribute('aria-pressed',F.subs[k]);});
  $('#iSave').onclick=saveItemForm;
}
function readItemForm(){
  const v=id=>{const e=$('#'+id);return e?e.value:null;};
  if($('#iName'))F.name=v('iName');
  if($('#iTarget')){F.target=parseFloat(v('iTarget'));F.unit=v('iUnit').trim();F.step=parseFloat(v('iStep'));}
  if($('#iLevels'))F.levels=v('iLevels').split('\n').map(s=>s.trim()).filter(Boolean);
  if($('#iSince'))F.since=v('iSince')||F.since;
}
function saveItemForm(){
  readItemForm();const err=$('#iErr');
  if(!F.name.trim()){err.textContent='اكتب اسم البند.';return;}
  if(F.type==='count'&&!(F.target>0)){err.textContent='الهدف يجب أن يكون أكبر من صفر.';return;}
  if(F.type==='count'&&!(F.step>0))F.step=1;
  if(F.type==='level'&&F.levels.length<2){err.textContent='اكتب مستويين على الأقل، كل مستوى في سطر.';return;}
  if(F.sched.mode==='wd'&&!F.sched.wd.length){err.textContent='اختر يومًا واحدًا على الأقل.';return;}
  if(!isDate(F.since)||F.since>todayStr()){err.textContent='تاريخ البداية غير صحيح.';return;}
  const old=F.id?itemById(F.id):null;
  if(old&&old.type!==F.type&&hasRecs(F.id)){
    ask('تغيير طريقة التسجيل يجعل التسجيلات السابقة لهذا البند غير متوافقة، فتُحذف. هل تريد المتابعة؟','تغيير وحذف القديم').then(ok=>{if(ok){purgeRecs(F.id);commitItem();}});return;
  }
  if(old&&old.type==='level'&&F.type==='level'&&old.levels.length!==F.levels.length&&hasRecs(F.id))toast('تنبيه: تغيّر عدد المستويات؛ قد تختلف قراءة التسجيلات السابقة');
  commitItem();
}
function commitItem(fromCard){
  if(!F.id&&BRANCH_CATS.includes(F.cat)&&branchCount(F.cat)>=MAX_BRANCHES){const e=$('#iErr');if(e)e.textContent=`بلغ قسم «${CAT[F.cat].name}» حده (${MAX_BRANCHES} فروع).`;else toast(`الحد ${MAX_BRANCHES} فروع في هذا القسم`);return;}
  const it=cleanItem(Object.assign({},F,{id:F.id||('u_'+uid())}));
  if(!it){if($('#iErr'))$('#iErr').textContent='تعذّر حفظ البند.';return;}
  const i=S.items.findIndex(x=>x.id===it.id);
  if(i>=0)S.items[i]=it;else{
    let pos=-1;S.items.forEach((x,j)=>{if(x.cat===it.cat)pos=j;});
    if(pos<0){const order=CATS.map(c=>c.k);pos=S.items.findIndex(x=>order.indexOf(x.cat)>order.indexOf(it.cat));S.items.splice(pos<0?S.items.length:pos,0,it);}
    else S.items.splice(pos+1,0,it);
  }
  markDirty('meta');if(!fromCard)closeSheet();renderAll();toast(F.id?'حُفظ التعديل':(fromCard?'أُضيف الفرع':'أُضيف البند'));
  if(fromCard){const f=document.querySelector(`[data-addb="${it.cat}"] input`);if(f)f.focus();}
}
function hasRecs(id){return Object.values(S.months).some(m=>Object.values(m.log).some(day=>day[id]));}
function purgeRecs(id){Object.keys(S.months).forEach(mk=>{const m=S.months[mk];let ch=false;Object.keys(m.log).forEach(d=>{if(m.log[d][id]){delete m.log[d][id];ch=true;if(!Object.keys(m.log[d]).length)delete m.log[d];}});if(ch)markDirty('m-'+mk);});}
async function deleteItem(id){
  const it=itemById(id);if(!it)return;
  if(!await ask(`حذف بند «${it.name}» وجميع تسجيلاته وملاحظاته؟ لا يمكن التراجع.`,'حذف'))return;
  S.items=S.items.filter(x=>x.id!==id);purgeRecs(id);markDirty('meta');closeSheet();renderAll();toast('حُذف البند');
}
function moveItem(id,dir){
  const it=itemById(id);if(!it)return;
  const same=S.items.map((x,i)=>({x,i})).filter(o=>o.x.cat===it.cat);
  const k=same.findIndex(o=>o.x.id===id),o2=same[k+dir];if(!o2)return;
  const a=same[k].i,b=o2.i;[S.items[a],S.items[b]]=[S.items[b],S.items[a]];
  markDirty('meta');renderManage();renderCats();
}

/* ---------- Backup ---------- */
async function exportData(){
  const data={app:'umruhu-fima-afnah',version:1,exportedAt:new Date().toISOString(),items:S.items,months:{}};
  Object.keys(S.months).forEach(mk=>{const m=S.months[mk];data.months[mk]={log:m.log,muh:m.muh,u:m.u};});
  const txt=JSON.stringify(data),fname=`umruhu-${todayStr()}.json`;
  let saved=false;
  try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:fname,data:new Blob([txt],{type:'application/json'})});saved=true;}}catch(e){}
  if(!saved&&!(window.claude&&window.claude.use)){try{const u=URL.createObjectURL(new Blob([txt],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);saved=true;}catch(e){}}
  S.prefs.lastBackup=new Date().toISOString();savePrefs();renderBackup();
  openSheet(`${sheetHead('تصدير نسخة احتياطية')}
  <p>${saved?`حُفظ الملف <b dir="ltr">${fname}</b>. `:''}${saved?'ويمكنك أيضًا نسخ النص التالي وحفظه.':'انسخ النص التالي واحفظه في ملف نصي أو أرسله إلى نفسك؛ وتستورده لاحقًا من «استيراد».'}</p>
  <textarea class="inp json" id="expTxt" readonly>${esc(txt)}</textarea>
  <p class="hint">النسخة تتضمن ملاحظاتك ومحاسبتك الشخصية، فاحفظها في مكان آمن.</p>
  <div class="btns"><button class="btn primary" id="cpBtn">${icon('copy')}نسخ النص</button><button class="btn" data-close>تم</button></div>`);
  $('#cpBtn').onclick=async()=>{const ta=$('#expTxt');try{await navigator.clipboard.writeText(ta.value);toast('تم النسخ');}catch(e){ta.focus();ta.select();try{document.execCommand('copy');toast('تم النسخ');}catch(e2){toast('حدد النص وانسخه يدويًا');}}};
}
function parseBackup(txt){
  let o;try{o=JSON.parse(txt);}catch(e){return{err:'تعذّرت قراءة النص: ليس بصيغة JSON صحيحة.'};}
  if(!o||o.app!=='umruhu-fima-afnah'||!Array.isArray(o.items))return{err:'هذا ليس نسخة احتياطية من «عمره فيما أفناه».'};
  if(typeof o.version!=='number'||o.version>1)return{err:'أُنشئت هذه النسخة بإصدار غير معروف.'};
  const items=dedupe(o.items.map(cleanItem).filter(Boolean));const months={};let days=0;
  if(o.months&&typeof o.months==='object')for(const mk in o.months){if(!/^\d{4}-\d{2}$/.test(mk))continue;months[mk]=cleanMonth(o.months[mk]||{});days+=Object.keys(months[mk].log).length;}
  return{items,months,days,exportedAt:o.exportedAt};
}
function openImport(){
  openSheet(`${sheetHead('استيراد نسخة احتياطية')}
  <p>اختر ملف النسخة (.json) أو الصق محتواه.</p>
  <input class="inp" type="file" id="impFile" accept=".json,application/json,text/plain">
  <textarea class="inp json" id="impTxt" placeholder="أو الصق النص هنا" style="margin-top:8px;min-height:100px"></textarea>
  <div class="err" id="impErr"></div><div id="impRes"></div>
  <div class="btns" id="impBtns"><button class="btn primary" id="impCheck">فحص</button><button class="btn" data-close>إلغاء</button></div>`);
  $('#impFile').onchange=ev=>{const f=ev.target.files[0];if(!f)return;if(f.size>20e6){$('#impErr').textContent='الملف كبير جدًا.';return;}
    const r=new FileReader();r.onload=()=>{$('#impTxt').value=r.result;checkImport();};r.onerror=()=>{$('#impErr').textContent='تعذّرت قراءة الملف.';};r.readAsText(f);};
  $('#impCheck').onclick=checkImport;
}
function checkImport(){
  $('#impErr').textContent='';$('#impRes').innerHTML='';
  const txt=$('#impTxt').value.trim();if(!txt){$('#impErr').textContent='اختر ملفًا أو الصق النص أولًا.';return;}
  const r=parseBackup(txt);if(r.err){$('#impErr').textContent=r.err;return;}
  $('#impRes').innerHTML=`<div class="method" style="font-size:14.5px;color:#26302b"><b>النسخة سليمة:</b> ${r.items.length} بندًا و${r.days} يومًا مسجّلًا${r.exportedAt?`، صُدّرت في ${esc(fmtLong(ymd(new Date(r.exportedAt))))}`:''}.<br><br>
  <b>دمج:</b> يضيف البنود والتسجيلات غير الموجودة ويبقي ما عندك.<br><b>استبدال:</b> يحذف كل ما عندك ويضع النسخة مكانه.</div>`;
  $('#impBtns').innerHTML=`<button class="btn primary" id="impMerge">دمج</button><button class="btn danger" id="impReplace">استبدال</button><button class="btn" data-close>إلغاء</button>`;
  $('#impMerge').onclick=()=>{
    const ids=new Set(S.items.map(i=>i.id));let addI=0;r.items.forEach(i=>{if(!ids.has(i.id)){S.items.push(i);addI++;}});if(addI)markDirty('meta');
    Object.keys(r.months).forEach(mk=>{const src=r.months[mk],dst=month(mk,true);let ch=false;
      Object.keys(src.log).forEach(d=>{const day=dst.log[d]=dst.log[d]||{};Object.keys(src.log[d]).forEach(id=>{if(!day[id]){day[id]=src.log[d][id];ch=true;}});});
      Object.keys(src.muh).forEach(d=>{if(!dst.muh[d]){dst.muh[d]=src.muh[d];ch=true;}});
      if(ch)markDirty('m-'+mk);});
    closeSheet();renderAll();toast('تم الدمج');};
  $('#impReplace').onclick=async()=>{
    if(!await ask('سيُحذف كل ما عندك ويُستبدل بمحتوى النسخة. هل تتابع؟','استبدال'))return;
    Object.keys(S.months).forEach(mk=>{if(!r.months[mk]){Cloud.del.add('m-'+mk);Cloud.dirty.delete('m-'+mk);}});
    S.items=r.items.length?r.items:defaultItems(todayStr());S.months=r.months;
    markDirty('meta');Object.keys(S.months).forEach(mk=>markDirty('m-'+mk));
    closeSheet();renderAll();toast('استُبدلت البيانات');};
}

/* ---------- More ---------- */
function openMore(){
  const where=Cloud.col?'في حسابك على Claude، في مساحة خاصة بك لا يطّلع عليها غيرك، فتصل إليها من أي جهاز تفتح منه هذه الصفحة. وتُحفظ معها نسخة على هذا الجهاز ليعمل بلا اتصال.':'في متصفح هذا الجهاز فقط، ولا تُرسَل إلى أي خادم. ولنقلها إلى جهاز آخر استعمل التصدير ثم الاستيراد.';
  openSheet(`${sheetHead('المزيد')}
  <h4 class="sub">عن الصفحة</h4>
  <p class="info">«عمره فيما أفناه» أداة شخصية لمحاسبة النفس ومتابعة العبادات والعادات الحسنة. البنود كلها قابلة للتعديل من «إدارة البنود». والنسب فيها تقريبية لما تسجّله بنفسك، وليست ميزانًا للقبول؛ فالقبول عند الله.</p>
  <h4 class="sub">أين تُحفظ بياناتك؟</h4>
  <p class="info">${where}</p>
  <h4 class="sub">إدارة البيانات</h4>
  <div class="btns"><button class="btn" data-action="export">${icon('download')}تصدير</button><button class="btn" data-action="import">${icon('upload')}استيراد</button></div>
  <div class="btns"><button class="btn danger" id="wipeBtn">${icon('trash')}حذف جميع التسجيلات والمحاسبة</button></div>
  <p class="hint">الحذف يُبقي البنود ويمسح التسجيلات والملاحظات والمحاسبة من كل مكان حُفظت فيه.</p>`);
  $('#wipeBtn').onclick=async()=>{
    if(!Object.keys(S.months).length){toast('لا توجد تسجيلات');return;}
    if(!await ask('ستُحذف جميع التسجيلات والملاحظات والمحاسبة. يُنصح بالتصدير أولًا. هل تحذف؟','حذف الكل'))return;
    Object.keys(S.months).forEach(mk=>{Cloud.del.add('m-'+mk);Cloud.dirty.delete('m-'+mk);});
    S.months={};saveLocal();scheduleFlush();closeSheet();renderAll();renderMuh(true);toast('حُذفت التسجيلات');};
}

/* ---------- Events ---------- */
function setDate(d){const t=todayStr();selDate=d>t?t:d;syncCal();renderAll();renderMuh(true);}
function openAcc(name){S.prefs.open[name]=true;savePrefs();renderAccState();const el=document.querySelector(`[data-acc="${name}"]`);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}

document.addEventListener('click',async ev=>{
  const t=ev.target;let b;
  if((b=t.closest('[data-action]'))){if(b.dataset.action==='export')exportData();else openImport();return;}
  if((b=t.closest('.acc-head'))){const n=b.parentElement.dataset.acc;S.prefs.open[n]=!S.prefs.open[n];savePrefs();renderAccState();return;}
  if((b=t.closest('[data-cat]'))){const k=b.dataset.cat;openCats[k]=!openCats[k];renderCats();return;}
  if((b=t.closest('[data-tick]'))){const id=b.dataset.tick,r=rec(selDate,id);setRec(selDate,id,{v:r&&r.v?null:1});renderDay();return;}
  if((b=t.closest('[data-inc]'))){const it=itemById(b.dataset.inc),r=rec(selDate,it.id);setRec(selDate,it.id,{v:Math.round(((r&&r.v||0)+it.step)*100)/100});renderDay();return;}
  if((b=t.closest('[data-dec]'))){const it=itemById(b.dataset.dec),r=rec(selDate,it.id);const v=Math.max(0,Math.round(((r&&r.v||0)-it.step)*100)/100);setRec(selDate,it.id,{v:v||null});renderDay();return;}
  if((b=t.closest('[data-cv]'))){openCounter(b.dataset.cv);return;}
  if((b=t.closest('[data-lvl]'))){const id=b.dataset.lvl,i=+b.dataset.i,r=rec(selDate,id);setRec(selDate,id,{v:r&&r.v===i+1?null:i+1});renderDay();return;}
  if((b=t.closest('[data-pl]'))){const id=b.dataset.pl,k=b.dataset.k,r=rec(selDate,id);setRec(selDate,id,{v:r&&r.v===k?null:k});renderDay();return;}
  if((b=t.closest('[data-sub]'))){const id=b.dataset.sub,k=b.dataset.k,r=rec(selDate,id);setRec(selDate,id,{[k]:r&&r[k]?null:1});renderDay();return;}
  if((b=t.closest('[data-note]'))){openNote(b.dataset.note);return;}
  if((b=t.closest('[data-day]'))){setDate(b.dataset.day);window.scrollTo({top:0,behavior:'smooth'});return;}
  if((b=t.closest('[data-goto]'))){setDate(b.dataset.goto);window.scrollTo({top:0,behavior:'smooth'});return;}
  if((b=t.closest('[data-cal]'))){calM+=+b.dataset.cal;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}renderCalendar();return;}
  if((b=t.closest('[data-stat]'))){statTab=b.dataset.stat;renderStats();return;}
  if((b=t.closest('[data-additem]'))){openItemForm(null,b.dataset.additem||null);return;}
  if((b=t.closest('[data-edititem]'))){openItemForm(b.dataset.edititem);return;}
  if((b=t.closest('[data-delitem]'))){deleteItem(b.dataset.delitem);return;}
  if((b=t.closest('[data-mv]'))){moveItem(b.dataset.mv,+b.dataset.dir);return;}
  if((b=t.closest('[data-nav]'))){const n=b.dataset.nav;
    $$('.bnav button').forEach(x=>x.classList.toggle('on',x===b));
    if(n==='home')window.scrollTo({top:0,behavior:'smooth'});
    else if(n==='more')openMore();
    else openAcc(n);
    if(n==='more')setTimeout(()=>$$('.bnav button').forEach(x=>x.classList.toggle('on',x.dataset.nav==='home')),300);
    return;}
});
document.addEventListener('submit',ev=>{const f=ev.target.closest('[data-addb]');if(!f)return;ev.preventDefault();addBranch(f.dataset.addb,f.querySelector('input').value);});
document.addEventListener('keydown',ev=>{
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('acc-head')){ev.preventDefault();ev.target.click();}
  if(ev.key==='Escape'){if(!$('#dlg').hidden)$('#dlg').querySelector('[data-no]').click();else if(!$('#sheetLayer').hidden)closeSheet();}
});
$('#btnSettings').onclick=openMore;
$('#prevDay').onclick=()=>setDate(addDays(selDate,-1));
$('#nextDay').onclick=()=>setDate(addDays(selDate,1));
$('#todayBtn').onclick=()=>setDate(todayStr());
$('#datePicker').addEventListener('change',e=>{if(isDate(e.target.value))setDate(e.target.value);});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;const t=todayStr();if(t!==lastToday){if(selDate===lastToday)selDate=t;lastToday=t;syncCal();renderAll();renderMuh(true);}});

/* ---------- Boot ---------- */
(async function boot(){
  renderStatic();syncCal();
  try{
    await Local.init();
    const st=await Local.get('state');
    if(st&&Array.isArray(st.items)){S.items=dedupe(st.items.map(cleanItem).filter(Boolean));S.metaU=st.metaU||0;
      if(st.months&&typeof st.months==='object')for(const mk in st.months){if(/^\d{4}-\d{2}$/.test(mk)){S.months[mk]=cleanMonth(st.months[mk]||{});}}}
    const p=await Local.get('prefs');if(p&&typeof p==='object'){Object.assign(S.prefs,p);S.prefs.open=S.prefs.open||{};S.prefs.closedCats=S.prefs.closedCats||{};}
  }catch(e){}
  if(!S.items.length&&!S.metaU){S.items=defaultItems(todayStr());S.metaU=0;}
  renderAccState();renderAll();renderMuh(true);
  initCloud().then(()=>{renderBackup();renderWarn();});
  try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
})();
})();
</script>
</body>
